set -ga terminal-overrides "alacritty:Tc"
source-file -q ~/.config/tmux/os.conf

# Pane movement
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split with same path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g mouse on
setw -g automatic-rename on
set -g history-limit 50000

# Use vim keybindings in copy mode
setw -g mode-keys vi

set -g status-interval 5
bind r source-file ~/.tmux.conf \; display-message "Reloading configuration ..."

# Window notifications
setw -g monitor-activity on
set -g visual-activity on

# Allow image protocols (imgcat) through tmux
set -g allow-passthrough on

# Theme, renders the status bar
set -g @onedark_time_format "%H:%M:%S"
set -g @onedark_date_format "%d %b %Y"
run-shell ~/.tmux/tmux-onedark-theme.tmux
